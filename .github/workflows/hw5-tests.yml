name: HW5 Tests

on:
  push:
    branches: [hw5]
    paths:
      - 'hw2/hw/**'
      - '.github/workflows/hw5-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hw2/hw/**'
      - '.github/workflows/hw5-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hw2/hw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-coverage.txt
      - run: python -m pytest test_homework2.py test_hw5_coverage.py -q --cov=shop_api --cov-branch --cov-report=term --cov-fail-under=95
